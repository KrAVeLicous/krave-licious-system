<p>Payment status: <span class="c ${pc}">${pl}</span></p></div>`};
/* Notifications, global search, header refresh */
const nots=()=>{const o=mine(),ad=me.r==='a',ow=o.filter(x=>x.st==='received'&&due(x)>.005),lw=ad?dk().filter(lowk):[],ex=ad?dk().filter(k=>S.T[k].q&&S.T[k].e===iso(1)):[],p=o.filter(x=>x.st==='ordered').length,pl=n=>n>1?'s':'';
return [[p,'🛒',p+' new order'+pl(p)+' waiting for the vendor','ord'],[ow.length,'💳',ow.length+' outstanding payment'+pl(ow.length)+', '+rm(ow.reduce((a,x)=>a+due(x),0)),'pay'],[lw.length,'📦',lw.length+' low stock product'+pl(lw.length),'stk'],[ex.length,'⏰',ex.length+' product'+pl(ex.length)+' expiring tomorrow','stk']].filter(n=>n[0])};
const gsr=q=>{q=q.trim().toLowerCase();if(!q)return'';const h=mine().filter(x=>['#'+x.id,inv(x),VN[x.v][0],...Object.keys(x.items).map(k=>S.C[k].n)].join(' ').toLowerCase().includes(q)).slice(0,8);
return h.map(x=>`<button data-a="open" data-id="${x.id}"><b>#${x.id}</b> ${inv(x)}, ${VN[x.v][0]}<small>${Object.keys(x.items).map(k=>S.C[k].n).join('<br>')}</small></button>`).join('')||'<div class="em" style="font-size:24px">🔍<p>No matches</p></div>'};
const hd=()=>{$('nb').textContent=nots().reduce((a,n)=>a+n[0],0)||'';if(dg)$('dlg').innerHTML=dg()};
/* ===== v4: sortable table columns (name, amount, date) and tidy pass ===== */
const SORT={},NUM=/^(?:RM\s*)?-?\d+(?:\.\d+)?(?:\s*(?:%|units?|days?|sold|pcs))?$/i,DT=/^\d{2} [A-Z][a-z]{2}$/;
const ct=td=>(td.dataset.v||td.innerText).split('\n')[0].replace(/^[^\p{L}\p{N}-]+/u,'').trim().replace(/,/g,'');
const tbKey=td=>{const t=ct(td);if(NUM.test(t))return parseFloat(t.replace(/^RM\s*/i,''));if(DT.test(t)){const d=Date.parse(t+' '+today.slice(0,4));return d>Date.now()+5e9?d-31557600000:d}return t.toLowerCase()};
const sortTbl=(t,c,d)=>{const n=t.rows[0].cells.length,all=[...t.rows].slice(1),b=t.rows[0].parentNode;
all.filter(r=>r.cells.length===n).map(r=>[tbKey(r.cells[c]),r]).sort((p,q)=>typeof p[0]===typeof q[0]?(p[0]>q[0]?d:p[0]<q[0]?-d:0):typeof p[0]==='number'?-1:1).forEach(([,r])=>b.appendChild(r));
all.filter(r=>r.cells.length!==n).forEach(r=>b.appendChild(r))};
const tidy=()=>document.querySelectorAll('#v table').forEach((t,i)=>{const h=t.rows[0];if(!h||!h.cells.length||h.cells[0].tagName!=='TH')return;t.dataset.t=i;const o=SORT[cur+i],rs=[...t.rows].slice(1).filter(r=>r.cells.length===h.cells.length);
[...h.cells].forEach((th,c)=>{if(!th.textContent.trim())return;th.classList.add('so');th.tabIndex=0;th.setAttribute('aria-sort',o&&o.c===c?(o.d>0?'ascending':'descending'):'none');
if(rs.length&&rs.every(r=>!r.cells[c].dataset.v&&NUM.test(ct(r.cells[c])))){th.classList.add('n');rs.forEach(r=>r.cells[c].classList.add('n'))}});if(o)sortTbl(t,o.c,o.d)});
const setSort=h=>{const t=h.closest('table'),k=cur+t.dataset.t,c=h.cellIndex,o=SORT[k];SORT[k]={c,d:o&&o.c===c?-o.d:1};tidy()};
document.addEventListener('click',e=>{const h=e.target.closest('#v th.so');if(h)setSort(h)});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('#v th.so')){e.preventDefault();setSort(e.target)}});
/* ===== v5: dessert kinds ===== */
const KIND=[[/cake|chiffon|lava|sponge/i,'Cake'],[/brownie|cookie/i,'Brownie'],[/panna|tiramisu|custard|pudding|cream/i,'Cream dessert'],[/kuih|lapis|onde|seri muka|pulut/i,'Kuih'],[/cendol|kacang|shaved|ice/i,'Shaved ice and cendol'],[/sago/i,'Sago dessert'],[/mango|fruit/i,'Fruit cup']];
const kind=k=>S.C[k].g||(KIND.find(([r])=>r.test(S.C[k].n))||[0,'Other dessert'])[1];
const KG={mg:'Fruit cup',pc:'Cake',cp:'Cream dessert',kl:'Kuih',sm:'Kuih',oo:'Kuih',lv:'Cake',bb:'Brownie',tc:'Cream dessert',cd:'Shaved ice and cendol',ak:'Shaved ice and cendol',sg:'Sago dessert'};
Object.keys(KG).forEach(k=>{const c=S.C[k];if(c&&DC.indexOf(c.g)<0)c.g=KG[k]});
/* ===== v6: invoice status option (Unpaid / Outgoing / Paid) ===== */
const pay3=x=>due(x)<.005?'Paid':x.paid>0?'Outgoing':'Unpaid',PC={Paid:'ok',Outgoing:'wn',Unpaid:'bd'};
const psel=x=>`<select class="ps ${PC[pay3(x)]}" data-ps="${x.id}" aria-label="Payment status of ${inv(x)}">${['Unpaid','Outgoing','Paid'].map(o=>`<option${o===pay3(x)?' selected':''}>${o}</option>`).join('')}</select>${x.dp?' <span class="c bd">Disputed</span>':''}`;
fl.ip='all';
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.ps)A.setps({id:t.dataset.ps,v:t.value})});
/* ===== v8: page-enter animation after a tab change ===== */
const enter=()=>{const v=$('v');v.classList.remove('ent');void v.offsetWidth;v.classList.add('ent');clearTimeout(enter.t);enter.t=setTimeout(()=>v.classList.remove('ent'),1000)};
document.addEventListener('click',e=>{if(e.target.closest('[data-a="tab"],[data-a="goto"]'))enter()});
const F=id=>S.O.find(x=>x.id==id);
const A={
tab:d=>{cur=d.t;render();scrollTo(0,0)},
fill:d=>{$('lu').value=d.u;$('lp').value=d.p},
login:()=>{const u=cl($('lu').value),p=$('lp').value,v=VN.findIndex(x=>x[1]===u&&x[2]===p);
if(u==='admin'&&p==='krave123')me={u,r:'a',n:'KraVe Licious'};else if(v>=0)me={u,r:'v',i:v,n:VN[v][0]};
else{lg('Failed sign-in as "'+u+'"','in','guest');save();return msg('Wrong username or password')}
cur=me.r==='a'?'dash':'vdash';lg('Signed in');save();busy(render)},
out:()=>{lg('Signed out');save();me=null;render()},
reset:()=>{S=seed();save();render();msg('Sample data restored')},
log:d=>{lg(d.m,'out');save()},
order:()=>{if(!shd(+fl.ov).on)return msg('This supplier is inactive. Activate it under Suppliers first');const it={},pr={};document.querySelectorAll('.qi').forEach(e=>{const q=Math.floor(+e.value);if(q>0){it[e.dataset.k]=q;pr[e.dataset.k]=S.C[e.dataset.k].c}});
if(!Object.keys(it).length)return msg('Enter a quantity for at least one dessert');
const id=Math.max(2000,...S.O.map(x=>x.id))+1;S.O.push({id,v:+fl.ov,d:today,items:it,pr,sent:{},got:{},ret:{},st:'ordered',paid:0,dp:''});
lg('Placed order #'+id+' with '+VN[fl.ov][0]+': '+Object.keys(it).map(k=>S.C[k].n+' x'+it[k]).join(', '));save();render();msg('Order placed')},
ship:d=>{const x=F(d.id);x.st='dispatched';x.sent={...x.items};lg('Dispatched order #'+x.id);save();render();msg('Order dispatched')},
recv:d=>{const x=F(d.id);document.querySelectorAll('.rq[data-o="'+d.id+'"]').forEach(e=>{const k=e.dataset.k;x.got[k]=Math.max(0,Math.min(x.sent[k],Math.floor(+e.value)||0))});
x.st='received';Object.keys(x.items).forEach(k=>{const g=x.got[k]||0;x.got[k]=g;if(g){S.T[k].q+=g;S.T[k].e=iso(S.C[k].s)}});
const sh=sum(x.sent)-sum(x.got);lg('Received order #'+x.id+': '+sum(x.got)+' of '+sum(x.sent)+' dispatched'+(sh?' (short '+sh+')':''));save();render();msg(sh?'Shortage of '+sh+' recorded':'Order received')},
dis:d=>{const x=F(d.id);x.dp=x.dp?'':me.r==='a'?'KraVe':'Vendor';lg((x.dp?'Disputed':'Resolved dispute on')+' order #'+x.id);save();render();msg(x.dp?'Dispute flagged':'Dispute resolved')},
ret:()=>{const x=F($('rd').value),k=$('rp').value,q=Math.floor(+$('rq').value),left=x&&x.got[k]?x.got[k]-(x.ret[k]||0):0;
if(!x||q<1||q>left)return msg('That order has '+left+' of this dessert left to return');
x.ret[k]=(x.ret[k]||0)+q;S.T[k].q=Math.max(0,S.T[k].q-q);lg('Returned '+q+' x '+S.C[k].n+' from order #'+x.id+' ('+$('rr').value+')');save();render();msg('Return recorded')},
sale:()=>{const k=$('sk').value,q=Math.floor(+$('sq').value);if(q<1||q>S.T[k].q)return msg('Only '+S.T[k].q+' '+S.C[k].n+' in stock');
S.T[k].q-=q;S.Sa.push({d:today,k,q});lg('Sold '+q+' x '+S.C[k].n+' ('+rm(q*S.C[k].p)+')');save();render();msg('Sale recorded')},
off:d=>{const t=S.T[d.k];if(!t.q)return;if(!d.y)return ask('Write off '+t.q+' x '+S.C[d.k].n+' at cost?',()=>A.off({k:d.k,y:1}));S.L.push({d:today,k:d.k,q:t.q,w:t.e<today?'Expired':'Spoiled'});lg('Wrote off '+t.q+' x '+S.C[d.k].n+' ('+rm(t.q*S.C[d.k].c)+')');t.q=0;save();render();msg('Written off')},
mpr:d=>{const c=+document.querySelector('.pc[data-k="'+d.k+'"]').value;if(!(c>0))return msg('Enter a price above 0');
lg('Changed price of '+S.C[d.k].n+' from '+rm(S.C[d.k].c)+' to '+rm(c));S.C[d.k].c=c;save();render();msg('Price saved')},
mon:d=>{const x=S.C[d.k];x.on=x.on?0:1;lg((x.on?'Resumed ':'Paused ')+x.n);save();render()},
madd:()=>{const n=cl($('an').value),c=+$('ac').value,h=Math.floor(+$('as').value)||2;if(!n||!(c>0))return msg('Enter a name and a price above 0');
const k='n'+Date.now().toString(36);S.C[k]={n,v:me.i,c,p:Math.round(c*1.75*2)/2,s:h,on:1};S.T[k]={q:0,e:today};lg('Added dessert "'+n+'" at '+rm(c));save();render();msg('Dessert added')},
/* ---- v3 actions: workflow, dialogs, payments, shops, products ---- */
prep:d=>{const x=F(d.id);x.st='preparing';lg('Vendor accepted order #'+x.id+' and started preparing');save();render();msg('Order is now being prepared')},
open:d=>{$('sres').hidden=true;$('gs').value='';show(()=>od(d.id))},
inv:d=>show(()=>iv(d.id)),
print:()=>window.print(),
close:()=>hide(),
yes:()=>{const f=okf;hide();if(f)f()},
bell:()=>show(()=>`<div class="mc sm"><div class="mh"><h2>Notifications</h2><span class="sp"></span><button class="btn s" data-a="close" aria-label="Close">✕</button></div>${nots().map(n=>`<button class="nt" data-a="goto" data-t="${n[3]}">${n[1]} ${n[2]}</button>`).join('')||'<div class="em">🎉<p>You are all caught up.</p></div>'}</div>`),
goto:d=>{hide();A.tab(d)},
rpay:d=>{const x=F(d.id),a=Math.round(+$('pa').value*100)/100,b=due(x);if(!(a>0)||a>b+.005)return msg('Enter an amount between RM 0.01 and '+rm(b));
const m=$('pm').value;(x.ph=x.ph||[]).push({d:today,a,m});x.paid=Math.min(bill(x),x.paid+a);x.dp='';lg('Payment recorded: '+rm(a)+' by '+m+' on order #'+x.id);save();render();msg('Payment recorded')},
sedit:d=>show(()=>{const i=+d.i,h=shd(i);return `<div class="mc sm"><h2 style="margin-top:0">Edit ${VN[i][0]}</h2><div class="g"><label>Address<input id="sa" maxlength="30" value="${h.a}"></label><label>Phone, with country code<input id="sph" maxlength="15" inputmode="tel" value="${VN[i][3]}"></label><label>Contact person<input id="sc" maxlength="30" value="${h.c}"></label><label>Status<select id="ss"><option value="1"${h.on?' selected':''}>Active</option><option value="0"${h.on?'':' selected'}>Inactive</option></select></label><div class="f"><button class="btn p" data-a="ssave" data-i="${i}">Save supplier</button><button class="btn" data-a="close">Cancel</button></div></div></div>`}),
ssave:d=>{const i=+d.i,a=cl($('sa').value),c=cl($('sc').value),p=$('sph').value.replace(/\D/g,'');if(!a||!c||p.length<9)return msg('Enter an address, a contact person and a phone number with country code');
(S.H=S.H||{})[i]={a,c,p,on:+$('ss').value};VN[i][3]=p;lg('Updated supplier details for '+VN[i][0]);save();hide();render();msg('Supplier saved')},
pedit:d=>show(()=>{const k=d.k,e=k?S.C[k]:{n:'',v:0,g:'',c:3,p:5.5,m:MIN,s:2};return `<div class="mc sm"><h2 style="margin-top:0">${k?'Edit':'Add'} product</h2><div class="g"><label>Name<input id="pn" maxlength="30" value="${e.n}"></label>${k?'':`<label>Supplier<select id="pv">${VN.map((v,i)=>`<option value="${i}">${v[0]}</option>`).join('')}</select></label>`}<label>Category<select id="pg">${DC.map(c=>`<option${c===(k?kind(k):e.g)?' selected':''}>${c}</option>`).join('')}</select></label><label>Supplier price (RM)<input id="ppc" type="number" min="0" step=".1" value="${e.c}"></label><label>Selling price (RM)<input id="pps" type="number" min="0" step=".1" value="${e.p}"></label><label>Minimum stock<input id="pmn" type="number" min="0" value="${e.m??MIN}"></label><label>Expiry days<input id="pex" type="number" min="1" value="${e.s}"></label><div class="f"><button class="btn p" data-a="psave" data-k="${k||''}">Save product</button><button class="btn" data-a="close">Cancel</button></div></div></div>`}),
psave:d=>{const n=cl($('pn').value),c=+$('ppc').value,p=+$('pps').value,m=Math.floor(+$('pmn').value),s=Math.floor(+$('pex').value);
if(!n||!(c>0)||!(p>c)||m<0||!(s>=1))return msg('Enter a name, a supplier price above 0, a higher selling price, and valid stock and expiry values');
let k=d.k;const e={n,g:cl($('pg').value),c,p,m,s};
if(k){Object.assign(S.C[k],e);lg('Updated product "'+n+'"')}else{k='n'+Date.now().toString(36);S.C[k]={...e,v:+$('pv').value,on:1};S.T[k]={q:0,e:today};lg('Added product "'+n+'"')}
save();hide();render();msg('Product saved')},
pdel:d=>{const k=d.k;if(S.O.some(x=>k in x.items)||S.Sa.some(s=>s.k===k)||S.L.some(l=>l.k===k))return msg('This product has order history. Pause it instead of deleting it');
ask('Delete '+S.C[k].n+'? This cannot be undone.',()=>{lg('Deleted product "'+S.C[k].n+'"');delete S.C[k];delete S.T[k];save();render();msg('Product deleted')})},
setps:d=>{const x=F(d.id),v=d.v,now=pay3(x);render();if(v===now)return;
if(v==='Paid')return show(()=>`<div class="mc sm"><h2 style="margin-top:0">Mark ${inv(x)} as paid?</h2><p>${rm(due(x))} will be recorded as paid.</p><div class="f"><label>Method<select id="pm"><option>Cash</option><option>Bank Transfer</option><option>QR</option><option>Online Banking</option></select></label><input id="pa" type="hidden" value="${due(x).toFixed(2)}"><button class="btn p" data-a="paidfull" data-id="${x.id}">Confirm paid</button><button class="btn" data-a="close">Cancel</button></div></div>`);
if(v==='Unpaid')return ask('Clear all payments on '+inv(x)+' and mark it unpaid?',()=>{x.paid=0;x.ph=[];lg(inv(x)+' marked unpaid, payments cleared');save();render();msg('Invoice marked unpaid')});
if(now==='Paid')return msg('That invoice is already paid. Set it to Unpaid first, then record the part payment');
show(()=>od(x.id));msg('Record the amount paid so far')},
paidfull:d=>{A.rpay(d);if(due(F(d.id))<.005)hide()}
};
function render(){const top=$('top');top.hidden=!me;
if(!me){hide();$('v').innerHTML=V.login();return}
$('who').textContent=me.n+(me.r==='a'?' (admin)':'');
$('nav').innerHTML=TB[me.r].map(([t,n])=>`<button class="tab${t===cur?' on':''}" data-a="tab" data-t="${t}">${n}</button>`).join('');
$('v').innerHTML=V[cur]();tidy();hd()}
document.addEventListener('click',e=>{if(e.target.id==='dlg')hide();if(!e.target.closest('.sr'))$('sres').hidden=true;const b=e.target.closest('[data-a]');if(b&&!b.disabled)A[b.dataset.a](b.dataset)});
document.addEventListener('change',e=>{const c=e.target.dataset.c;if(c){fl[c]=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='lp'||e.target.id==='lu'))A.login();if(e.key==='Escape'){hide();$('sres').hidden=true}});
document.addEventListener('input',e=>{const t=e.target,k=t.dataset.s;
if(t.id==='gs'){const r=$('sres');r.innerHTML=gsr(t.value);r.hidden=!t.value.trim()}
else if(t.classList.contains('qi'))$('ot').textContent=rm([...document.querySelectorAll('.qi')].reduce((a,n)=>a+Math.max(0,Math.floor(+n.value))*S.C[n.dataset.k].c,0)*(1+TAX));
else if(k){fl[k]=t.value;const p=t.selectionStart;render();const n=document.querySelector('[data-s="'+k+'"]');n.focus();n.setSelectionRange(p,p)}});
render();
</script></body></html>
